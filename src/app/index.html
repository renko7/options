<title>Options Desk Manual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&display=swap">
<link rel="stylesheet" href="styles.css">

<header class="topbar">
  <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open course navigation" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#home">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26"><path d="M3 24 L14 24 L29 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="14" cy="24" r="3.2" fill="currentColor"/></svg>
    </span>
    <span class="brand-name">Options Desk Manual</span>
  </a>
  <div class="search" role="search">
    <label class="visually-hidden" for="search-input">Search lessons and terms</label>
    <input id="search-input" type="search" placeholder="Search lessons and terms" autocomplete="off">
    <div class="search-results" id="search-results" hidden></div>
  </div>
  <nav class="top-links" aria-label="Sections">
    <a href="#tools">Tools</a>
    <button type="button" class="link-btn" id="glossary-btn">Glossary</button>
  </nav>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Course navigation">
    <div class="sidebar-inner" id="nav"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main" id="main" tabindex="-1">
    <div class="loading">Loading the course…</div>
  </main>
</div>

<aside class="glossary-panel" id="glossary-panel" aria-label="Glossary" hidden>
  <div class="gp-head">
    <h2>Glossary</h2>
    <button class="icon-btn" id="glossary-close" aria-label="Close glossary">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <label class="visually-hidden" for="glossary-filter">Filter terms</label>
  <input id="glossary-filter" type="search" placeholder="Filter terms" autocomplete="off">
  <div class="gp-list" id="glossary-list"></div>
</aside>

<script type="module" src="app.js"></script>
